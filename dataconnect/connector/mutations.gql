# =========================
# ASSET
# =========================

mutation CreateAsset(
  $assetTag: String!
  $type: String
  $departmentId: UUID
  $employeeId: UUID
  $vendorId: UUID

  $cpuBrand: String
  $monitorBrand: String
  $keyboardBrand: String
  $mouseBrand: String

  $cpuSerial: String
  $monitorSerial: String
  $keyboardSerial: String
  $mouseSerial: String

  $macAddress: String

  $invoiceNumber: String
  $purchaseDate: Date
  $warrantyYears: Int
  $warrantyExpiry: Date

  $windowsLicense: String
  $msLicense: String
  $windowsLicensePurchaseDate: Date
  $msLicensePurchaseDate: Date

  $antivirus: String
  $status: String
  $notes: String
) @auth(level: PUBLIC) {
  asset_insert(
    data: {
      assetTag: $assetTag
      type: $type

      departmentId: $departmentId
      employeeId: $employeeId
      vendorId: $vendorId

      cpuBrand: $cpuBrand
      monitorBrand: $monitorBrand
      keyboardBrand: $keyboardBrand
      mouseBrand: $mouseBrand

      cpuSerial: $cpuSerial
      monitorSerial: $monitorSerial
      keyboardSerial: $keyboardSerial
      mouseSerial: $mouseSerial

      invoiceNumber: $invoiceNumber
      purchaseDate: $purchaseDate
      warrantyYears: $warrantyYears
      warrantyExpiry: $warrantyExpiry

      windowsLicense: $windowsLicense
      msLicense: $msLicense
      windowsLicensePurchaseDate: $windowsLicensePurchaseDate
      msLicensePurchaseDate: $msLicensePurchaseDate

      antivirus: $antivirus
      status: $status
      notes: $notes
    }
  )
}


mutation UpdateAsset(
  $id: UUID!
  $assetTag: String
  $type: String
  $departmentId: UUID
  $employeeId: UUID
  $vendorId: UUID

  $cpuBrand: String
  $monitorBrand: String
  $keyboardBrand: String
  $mouseBrand: String

  $cpuSerial: String
  $monitorSerial: String
  $keyboardSerial: String
  $mouseSerial: String
  $macAddress: String

  $invoiceNumber: String
  $purchaseDate: Date
  $warrantyYears: Int
  $warrantyExpiry: Date

  $windowsLicense: String
  $msLicense: String
  $windowsLicensePurchaseDate: Date
  $msLicensePurchaseDate: Date

  $antivirus: String
  $status: String
  $notes: String
) @auth(level: PUBLIC) {
  asset_update(
    key: {id: $id}
    data: {
      assetTag: $assetTag
      type: $type

      departmentId: $departmentId
      employeeId: $employeeId
      vendorId: $vendorId

      cpuBrand: $cpuBrand
      monitorBrand: $monitorBrand
      keyboardBrand: $keyboardBrand
      mouseBrand: $mouseBrand

      cpuSerial: $cpuSerial
      monitorSerial: $monitorSerial
      keyboardSerial: $keyboardSerial
      mouseSerial: $mouseSerial
      macAddress: $macAddress

      invoiceNumber: $invoiceNumber
      purchaseDate: $purchaseDate
      warrantyYears: $warrantyYears
      warrantyExpiry: $warrantyExpiry

      windowsLicense: $windowsLicense
      msLicense: $msLicense
      windowsLicensePurchaseDate: $windowsLicensePurchaseDate
      msLicensePurchaseDate: $msLicensePurchaseDate

      antivirus: $antivirus
      status: $status
      notes: $notes
    }
  )
}


mutation UpdateAssetStatus(
  $id: UUID!
  $status: String!
) @auth(level: PUBLIC) {
  asset_update(
    key: {id: $id}
    data: {
      status: $status
    }
  )
}


mutation UpdateAssetAssignment(
  $id: UUID!

# =========================
# DEPARTMENT
# =========================

mutation CreateDepartment(
  $name: String!
  $head: String
  $description: String
) @auth(level: PUBLIC) {
  department_insert(
    data: {
      name: $name
      head: $head
      description: $description
    }
  )
}


mutation UpdateDepartment(
  $id: UUID!
  $name: String
  $head: String
  $description: String
) @auth(level: PUBLIC) {
  department_update(
    key: {id: $id}
    data: {
      name: $name
      head: $head
      description: $description
    }
  )
}


mutation DeleteDepartment(
  $id: UUID!
) @auth(level: PUBLIC) {
  department_delete(
    key: {id: $id}
  )
}



  $assetId: UUID!
  $departmentId: UUID
  $notes: String
) @auth(level: PUBLIC) {
  movement_insert(
    data: {
      movementType: $movementType
      movementDate: $movementDate
      fromLocation: $fromLocation
      toLocation: $toLocation
      assetId: $assetId
      departmentId: $departmentId
      notes: $notes
    }
  )
}


# =========================
# TRANSFER
# =========================

mutation CreateTransfer(
  $transferDate: Timestamp
  $assetId: UUID!
  $fromDepartmentId: UUID
  $toDepartmentId: UUID
  $fromEmployeeId: UUID
  $toEmployeeId: UUID
  $reason: String
  $approvedBy: String
  $handover: String
  $notes: String
  $status: String
) @auth(level: PUBLIC) {
  transfer_insert(
    data: {
      transferDate: $transferDate

      assetId: $assetId

      fromDepartmentId: $fromDepartmentId
      toDepartmentId: $toDepartmentId

      fromEmployeeId: $fromEmployeeId
      toEmployeeId: $toEmployeeId

      reason: $reason
      approvedBy: $approvedBy
      handover: $handover
      notes: $notes
      status: $status
    }
  )
}



# =========================
# MOVEMENTS
# =========================

query GetMovements @auth(level: PUBLIC) {
  movements(orderBy: [{movementDate: DESC}]) {
    id
    movementType
    movementDate
    fromLocation
    toLocation
    notes
    createdAt
    updatedAt

    asset {
      id
      assetTag
      type
      status

      department {
        id
        name
      }
    }

    department {
      id
      name
      head
      description
    }
  }
}


query GetRecentMovements($limit: Int!) @auth(level: PUBLIC) {
  movements(
    orderBy: [{movementDate: DESC}]
    limit: $limit
  ) {
    id
    movementType
    movementDate
    fromLocation
    toLocation
    notes
    createdAt
    updatedAt

    asset {
      id
      assetTag
      type
      status

      department {
        id
        name
      }
    }

    department {
      id
      name
      head
      description
    }
  }
}


# =========================
# TRANSFERS
# =========================

query GetTransfers @auth(level: PUBLIC) {
  transfers(orderBy: [{transferDate: DESC}]) {
    id
    transferDate

    reason
    approvedBy
    handover
    notes
    status

    createdAt
    updatedAt

    asset {
      id
      assetTag
      type
      status
    }

    fromDepartment {
      id
      name
      head
      description
    }

    toDepartment {
      id
      name
      head
      description
    }

    fromEmployee {
      id
      name
      email
      role
      phone
      status
    }

    toEmployee {
      id
      name
      email
      role
      phone
      status
    }
  }
}



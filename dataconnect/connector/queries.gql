# =========================
# ITAM QUERIES
# =========================

query GetDepartments @auth(level: PUBLIC) {
  departments(orderBy: [{name: ASC}]) {
    id
    name
    head
    description
    createdAt
    updatedAt
  }
}


query GetEmployees @auth(level: PUBLIC) {
  employees(orderBy: [{name: ASC}]) {
    id
    name
    email
    role
    phone
    status
    createdAt
    updatedAt

    department {
      id
      name
      head
      description
    }
  }
}


query GetAvailableEmployees @auth(level: PUBLIC) {
  employees(
    where: {status: {eq: "Active"}}
    orderBy: [{name: ASC}]
  ) {
    id
    name
    email
    role
    phone
    status
    createdAt
    updatedAt

    department {
      id
      name
      head
      description
    }
  }
}


query GetVendors @auth(level: PUBLIC) {
  vendors(orderBy: [{name: ASC}]) {
    id
    name
    contactPerson
    email
    phone
    address
    createdAt
    updatedAt
  }
}



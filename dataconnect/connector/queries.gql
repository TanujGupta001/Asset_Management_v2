# =========================
# AUDIT LOGS
# =========================

query GetAuditLogs($limit: Int!) @auth(level: PUBLIC) {
  auditLogs(
    orderBy: [{createdAt: DESC}]
    limit: $limit
  ) {
    id
    action
    entity
    entityId
    performedBy
    details
    createdAt
  }
}


# =========================
# ADMIN USERS
# =========================

query GetAdminUsers @auth(level: PUBLIC) {
  adminUsers(orderBy: [{username: ASC}]) {
    id
    username
    role
    createdAt
    updatedAt
  }
}


query GetAdminUserByUsername($username: String!) @auth(level: PUBLIC) {
  adminUsers(where: {username: {eq: $username}}) {
    id
    username
    password
    role
    createdAt
    updatedAt
  }
}

query GetAvailableResources @auth(level: PUBLIC) {

  assets(
    where: {
      status: {
        in: ["Idle", "Active"]
      }
    }
    orderBy: [{assetTag: ASC}]
  ) {
    id
    assetTag
    type
    status

    department {
      id
      name
      head
      description
    }

    employee {
      id
      name
    }
  }

  inventoryItems(
    where: {
      condition: {
        eq: "Working"
      }
    }
    orderBy: [{type: ASC}]
  ) {
    id
    type
    brand
    serial
    productKey
    condition
    assignedTo
    notes
  }

  telephones(
    where: {
      status: {
        eq: "Spare"
      }
    }
    orderBy: [{extension: ASC}]
  ) {
    id
    extension
    contactNumber
    assignedTo
    organization
    serial
    status
  }
}
